# Fail2ban filter for Herald's JSON-Lines audit log. Matches any entry
# whose result is "unauthorized" and extracts the source IP.
#
# This is defense-in-depth, not the real gate: Herald's URLs are meant to
# be fully public (bookmarked on a phone, even listed on a CV) - the actual
# gate is "no valid TOTP, nothing happens," not IP-based rate limiting.
#
# Install as /etc/fail2ban/filter.d/herald.conf.

[Definition]
failregex = ^\{.*"source_ip"\s*:\s*"<HOST>".*"result"\s*:\s*"unauthorized".*\}\s*$
ignoreregex =
